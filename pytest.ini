; development version for pytest
[pytest]
addopts = --timeout=60 --cov=src --cov-report=html -m 'not slow' --ignore lib --ignore lib64
markers = slow: This is a non-unit test and thus is not run by default. Use ``-m slow`` to run these, or ``-m 1`` to run all tests.
junit_family = legacy
consider_namespace_packages = true

filterwarnings =
   ; Keycloak uses untrusted SSL cert in dev
   ; post python 3.14
   ignore:Deprecated call to `pkg_resources.declare_namespace\(

   ; setuptools >= 81
   ignore:pkg_resources is deprecated as an API.
